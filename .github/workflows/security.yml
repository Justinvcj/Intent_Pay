name: Security

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Soft-fail if the repo doesn't have Dependency Graph / GHAS enabled.
    # Private repos without GHAS get "Dependency review is not supported";
    # once Dependency Graph lands, the check reports real diffs again.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9 # v4.7.1
        continue-on-error: true

  gradle-dependency-report:
    name: Gradle dependency report
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17

      - name: Dump app dependencies
        run: ./gradlew :app:dependencies --no-daemon --warning-mode=all 2>&1 | tee gradle-dependencies.txt || true

      - name: Upload dependency report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gradle-dependencies
          path: gradle-dependencies.txt
          if-no-files-found: warn
          retention-days: 30
